<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Cadastro</h1>

    <form action="/cadastra" method="POST">

        <input type="text"
               name="usuario"
               placeholder="Usuário"
               required>

        <input type="password"
               name="senha"
               placeholder="Senha"
               required>

        <button type="submit">
            Cadastrar
        </button>

    </form>

</div>

<a href="/login" class="botao">
    Voltar
</a>

</body>
</html>
